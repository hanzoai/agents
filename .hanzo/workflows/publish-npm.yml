name: Publish npm

on:
  push:
    tags: ['v*', 'hanzo-agents-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish @hanzo/agents to npm
    runs-on: [self-hosted, linux, amd64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Install ONLY the SDK package, not the whole workspace. The root
      # workspace pulls apps/desktop which needs node-pty (native, needs
      # g++) and is unrelated to publishing this library. Stay scoped.
      #
      # Workaround for npm/cli#4828: clean install (no lockfile) so
      # rollup's optional native dep (@rollup/rollup-linux-x64-gnu)
      # is pulled by its postinstall. Do NOT pass --ignore-scripts here:
      # that flag also skips rollup's postinstall and tsup fails at
      # build time with "Cannot find module @rollup/rollup-linux-x64-gnu".
      - name: Install SDK deps
        working-directory: sdk/typescript
        run: |
          rm -rf node_modules package-lock.json
          # Drop --force: it suppresses optional-dep install errors, which
          # leaves rollup without its native binary. Plain install lets npm
          # resolve optionalDependencies (@rollup/rollup-linux-x64-gnu) on
          # this linux/amd64 runner. If npm/cli#4828 strikes anyway, the
          # explicit follow-up install pulls the binary as a belt-and-
          # suspenders so tsup can find it at build time.
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @rollup/rollup-linux-x64-gnu

      - name: Build SDK
        working-directory: sdk/typescript
        run: npx tsup

      - name: Publish to npm
        working-directory: sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # Idempotent re-publish: if the tagged version is already on
        # registry.npmjs.org (e.g. a prior manual publish), exit 0 so
        # the workflow stays green and other tags in the same release
        # batch can ship. Any other failure still surfaces.
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if npm view "@hanzo/agents@${version}" version >/dev/null 2>&1; then
            echo "@hanzo/agents@${version} already published; skipping."
            exit 0
          fi
          npm publish --access public --ignore-scripts
